<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herdar relação anterior</title>
<style>body{margin:0;background:#f3f6f9;font-family:Segoe UI,Arial,sans-serif;color:#17202a}.wrap{max-width:1000px;margin:auto;padding:32px 20px}.card{background:#fff;border:1px solid #dce3ea;border-radius:16px;padding:22px;margin-bottom:18px}h1{margin:0 0 6px}.sub{color:#65717f;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label.t{display:block;font-weight:700;margin-bottom:7px}input[type=file]{width:100%;box-sizing:border-box;border:1px solid #dce3ea;border-radius:10px;padding:11px}.scroll{max-height:260px;overflow:auto;border:1px solid #dce3ea;border-radius:10px;padding:10px;background:#fbfcfd}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #dce3ea;border-radius:999px;padding:7px 10px;margin:4px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;margin-right:8px;margin-top:12px}.primary{background:#366092;color:#fff}.secondary{background:#eaf0f5;color:#244f78}.status{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#edf3f8}.show{display:block}.ok{background:#eaf7f0;color:#177245}.error{background:#fdecec;color:#a12727}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>Herdar informações da relação anterior</h1><p class="sub">Compara pelo NÚMERO SEI. A única coluna obrigatória nas duas planilhas é a chave SEI.</p>
<div class="card"><div class="grid"><div><label class="t">Relação anterior (fonte)</label><input id="fonte" type="file" accept=".xlsx"></div><div><label class="t">Nova relação (filha)</label><input id="filha" type="file" accept=".xlsx"></div></div><button class="secondary" id="carregar">Carregar colunas da fonte</button><div id="status" class="status"></div></div>
<div class="card"><label class="t">Colunas que devem ser herdadas</label><button class="secondary" id="todos">Selecionar todas</button><button class="secondary" id="limpar">Limpar seleção</button><div id="lista" class="scroll" style="margin-top:10px">Carregue a relação anterior.</div>
<div style="margin-top:16px"><label class="pill"><input type="radio" name="regra" value="true" checked> Valor da relação anterior prevalece</label><label class="pill"><input type="radio" name="regra" value="false"> Só preencher células vazias</label></div>
<button class="primary" id="processar">Gerar relação com histórico</button></div></div>
<script>const $=id=>document.getElementById(id);function st(msg,t=""){const e=$("status");e.textContent=msg;e.className="status show "+t}function render(cols){const c=$("lista");c.innerHTML="";cols.forEach(v=>{const l=document.createElement("label");l.className="pill";const i=document.createElement("input");i.type="checkbox";i.name="coluna";i.value=v;const up=v.toUpperCase();if(["OBS","OBSERVAÇÃO","DILAÇÃO","DILACAO","OFÍCIO","OFICIO","VENCIMENTO","DATA DE VENCIMENTO","ÁREA TÉCNICA","AREA TECNICA"].includes(up))i.checked=true;l.appendChild(i);l.appendChild(document.createTextNode(v));c.appendChild(l);});}
$("carregar").onclick=async()=>{try{if(!$("fonte").files.length)throw new Error("Selecione a relação anterior.");const fd=new FormData();fd.append("fonte",$("fonte").files[0]);st("Lendo colunas...");const r=await fetch("/api/colunas",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Erro.");render(d.colunas);st(`${d.colunas.length} colunas encontradas na aba ${d.aba}.`,"ok");}catch(e){st(e.message,"error")}};
$("todos").onclick=()=>document.querySelectorAll('input[name="coluna"]').forEach(x=>x.checked=true);$("limpar").onclick=()=>document.querySelectorAll('input[name="coluna"]').forEach(x=>x.checked=false);
$("processar").onclick=async()=>{try{if(!$("fonte").files.length)throw new Error("Selecione a relação anterior.");if(!$("filha").files.length)throw new Error("Selecione a nova relação.");const cols=[...document.querySelectorAll('input[name="coluna"]:checked')].map(x=>x.value);if(!cols.length)throw new Error("Selecione pelo menos uma coluna para herdar.");const fd=new FormData();fd.append("fonte",$("fonte").files[0]);fd.append("filha",$("filha").files[0]);fd.append("colunas",JSON.stringify(cols));fd.append("sobrescrever",document.querySelector('input[name="regra"]:checked').value);st("Processando...");const r=await fetch("/api/processar",{method:"POST",body:fd});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||"Erro.");}const blob=await r.blob(),cd=r.headers.get("content-disposition")||"";let nome="RELACAO_COM_HISTORICO.xlsx";const m=cd.match(/filename\*=UTF-8''([^;]+)/i);if(m)nome=decodeURIComponent(m[1]);const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);st(`Pronto. Reapareceram: ${r.headers.get("x-reapareceram")} · Com herança: ${r.headers.get("x-com-heranca")} · Células herdadas: ${r.headers.get("x-celulas-herdadas")}.`,"ok");}catch(e){st(e.message,"error")}};</script></body></html>
